services:

  api:
    build:
      context: ./fashionshop-api
    ports:
      - "8000:8000"
    env_file:
      - ./fashionshop-api/.env
    environment:
      APP_URL: http://localhost:8000
    volumes:
      # Giữ ảnh upload khi rebuild container
      - api_storage:/var/www/storage/app/public
    restart: unless-stopped

  admin:
    build:
      context: ./fashionshop-admin
    ports:
      - "5174:80"
    depends_on:
      - api
    restart: unless-stopped

  web:
    build:
      context: ./fashionshop-web
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api_storage:
