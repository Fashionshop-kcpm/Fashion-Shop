sonar.projectKey=YOUR_ORG_fashionshop
sonar.organization=YOUR_ORG

sonar.projectName=FashionShop
sonar.projectVersion=1.0

# Source directories
sonar.sources=fashionshop-api/app,fashionshop-web/src,fashionshop-admin/src

# Test directories
sonar.tests=tests

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/vendor/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/*.min.js,\
  **/dist/**,\
  **/build/**

# PHP config
sonar.php.version=8.2

# JS/TS coverage (nếu có)
sonar.javascript.lcov.reportPaths=tests/coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
