name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Laravel API ──────────────────────────────────────────
  api:
    name: API (PHP 8.3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashionshop-api

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, xml, zip, bcmath
          coverage: none

      - name: Cache composer
        uses: actions/cache@v4
        with:
          path: fashionshop-api/vendor
          key: composer-${{ hashFiles('fashionshop-api/composer.lock') }}

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: Setup .env & database
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run tests
        run: php artisan test --stop-on-failure

  # ── Admin (React) ─────────────────────────────────────────
  admin:
    name: Admin (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashionshop-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fashionshop-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ── Web (React) ───────────────────────────────────────────
  web:
    name: Web (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fashionshop-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: fashionshop-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
